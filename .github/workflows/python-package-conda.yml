name: Build LegendaViva (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --windowed --name LegendaViva
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all onnxruntime
          --collect-all av
          --collect-all tokenizers
          --collect-data deep_translator
          --hidden-import pyaudiowpatch
          legendaviva.py

      - name: Copiar LEIA-ME
        run: copy LEIA-ME.md dist\LegendaViva\

      - uses: actions/upload-artifact@v4
        with:
          name: LegendaViva-Windows
          path: dist/LegendaViva
